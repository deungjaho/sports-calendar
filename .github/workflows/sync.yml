name: Sync Sports Calendar to Gist

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动同步
    - cron: '0 0 * * *'
    # 每天 UTC 12:00 (北京时间 20:00) 再次检查刷新
    - cron: '0 12 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动一键触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Calendar Sync & Push to Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 sync_calendar.py
